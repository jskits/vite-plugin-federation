name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v0.0.2'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify publish tooling
        run: |
          node --version
          npm --version
          node <<'NODE'
          const { execFileSync } = require('node:child_process');

          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          const isSupported =
            major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));

          if (!isSupported) {
            throw new Error(`npm ${version} does not satisfy Trusted Publishing's npm >=11.5.1 requirement`);
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const tag = process.env.RELEASE_TAG;
          const packageJson = JSON.parse(
            fs.readFileSync('packages/vite-plugin-federation/package.json', 'utf8'),
          );

          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`Release tag must be semver-like and start with "v": ${tag}`);
          }

          const expectedTag = `v${packageJson.version}`;
          if (tag !== expectedTag) {
            throw new Error(`Release tag ${tag} does not match package version ${expectedTag}`);
          }

          console.log(`Publishing ${packageJson.name}@${packageJson.version}`);
          NODE

      - name: Build package
        run: pnpm --filter vite-plugin-federation build

      - name: Validate package tarball
        run: npm pack ./packages/vite-plugin-federation --dry-run --json

      - name: Publish package
        run: npm publish ./packages/vite-plugin-federation --access public
